<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="CyberShield">
  <!-- CyberShield mark. Original artwork for this project.
       Concept: a shield (protection) whose interior is a small network graph
       (the hosts being assessed), crossed by a horizontal sweep line (the scan
       in progress). Nothing here derives from an existing product's mark. -->
  <defs>
    <linearGradient id="csEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M24 3.2 41.5 8.6v14.2c0 10.4-7 18.6-17.5 22-10.5-3.4-17.5-11.6-17.5-22V8.6L24 3.2Z"
        fill="#0b1220" stroke="url(#csEdge)" stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Network graph inside the shield: three nodes and their links -->
  <g stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="15.5" x2="16.5" y2="26"/>
    <line x1="24" y1="15.5" x2="31.5" y2="26"/>
    <line x1="16.5" y1="26" x2="31.5" y2="26"/>
  </g>
  <g fill="#e6edf7">
    <circle cx="24" cy="15.5" r="3.1"/>
    <circle cx="16.5" cy="26" r="2.6"/>
    <circle cx="31.5" cy="26" r="2.6"/>
  </g>

  <!-- Scan sweep -->
  <line x1="11" y1="31.6" x2="37" y2="31.6" stroke="#22d3ee" stroke-width="1.8"
        stroke-linecap="round" opacity="0.75"/>
  <line x1="15.5" y1="35.4" x2="32.5" y2="35.4" stroke="#22d3ee" stroke-width="1.6"
        stroke-linecap="round" opacity="0.4"/>
</svg>
